<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Style Transfer App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 40px; background: #f8f9fa; }
    .preview-img { max-width: 100%; max-height: 300px; }
  </style>
</head>
<body>
<div class="container">
  <h2 class="text-center mb-4">🎨 이미지 스타일 전이</h2>
  <form method="POST" enctype="multipart/form-data">
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">콘텐츠 이미지</label>
        <input type="file" name="content" accept="image/*" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">스타일 이미지</label>
        <input type="file" name="style" accept="image/*" class="form-control" required>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">스타일 강도 (alpha: 0~1)</label>
      <input type="range" class="form-range" name="alpha" min="0" max="1" step="0.1" value="1.0">
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-primary px-5">스타일 전이 실행</button>
    </div>
  </form>

  {% if result_image %}
  <hr>
  <h4 class="mt-4">변환 결과</h4>
  <img src="{{ url_for('result_file', filename=result_image) }}" class="preview-img mt-3" alt="Result">
  {% endif %}
</div>
</body>
</html>
